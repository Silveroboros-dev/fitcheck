name: Public CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  boundary-check:
    name: boundary-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify public boundary
        run: python scripts/check_public_boundary.py --self-check --destination .

  offline-tests:
    name: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24.21.0 LTS for the offline DOM regression
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          check-latest: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install offline test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run exported offline suite in an isolated network namespace
        env:
          FITCHECK_POSTGRES_TEST_URL: ""
          GOOGLE_API_KEY: ""
          GEMINI_API_KEY: ""
          GOOGLE_APPLICATION_CREDENTIALS: /nonexistent/fitcheck-offline-suite.json
          GCE_METADATA_DISABLED: "true"
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" \
            /usr/bin/env "HOME=$HOME" "PATH=$PATH" "PYTHONUNBUFFERED=1" \
            "$PYTHON_BIN" -m pytest \
            --ignore=tests/test_job_store_postgres.py \
            --ignore=tests/test_mcp_schema_migration_postgres.py \
            -rs

  adk-client-contracts:
    name: adk-client-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_APPLICATION_CREDENTIALS: /nonexistent/fitcheck-adk-contracts.json
      GCE_METADATA_DISABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clients/adk/pyproject.toml

      - name: Install the package build frontend
        run: python -m pip install "build>=1.2,<2"

      - name: Build standalone ADK source and wheel distributions
        run: >-
          python -m build clients/adk
          --outdir "$RUNNER_TEMP/fitcheck-adk-dist"

      - name: Verify standalone ADK artifacts carry the license
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import tarfile
          import zipfile

          dist = Path(os.environ["RUNNER_TEMP"]) / "fitcheck-adk-dist"
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          expected = Path("clients/adk/LICENSE").read_bytes()
          with zipfile.ZipFile(wheels[0]) as archive:
              names = [
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/licenses/LICENSE")
              ]
              assert len(names) == 1, names
              assert archive.read(names[0]) == expected
          with tarfile.open(sdists[0], "r:gz") as archive:
              members = [
                  member for member in archive.getmembers()
                  if member.isfile()
                  and PurePosixPath(member.name).name == "LICENSE"
                  and len(PurePosixPath(member.name).parts) == 2
              ]
              assert len(members) == 1, members
              stream = archive.extractfile(members[0])
              assert stream is not None and stream.read() == expected
          PY

      - name: Install the standalone ADK wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/fitcheck-adk-wheel-smoke"
          ADK_WHEEL="$(find "$RUNNER_TEMP/fitcheck-adk-dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$ADK_WHEEL"
          "$RUNNER_TEMP/fitcheck-adk-wheel-smoke/bin/python" -m pip install \
            "$ADK_WHEEL" "pytest==9.1.1"

      - name: Verify isolated dependency resolution
        run: >-
          "$RUNNER_TEMP/fitcheck-adk-wheel-smoke/bin/python" -m pip check

      - name: Smoke the installed ADK wheel with credential-free contracts
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/fitcheck-adk-wheel-smoke/bin/python"
          "$GITHUB_WORKSPACE/clients/adk/run_contracts.py"
          --root "$GITHUB_WORKSPACE"
          --require-wheel-install

  postgres-contention:
    name: postgres-contention
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: fitcheck_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fitcheck_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FITCHECK_POSTGRES_TEST_URL: >-
        postgresql+psycopg://postgres:postgres@127.0.0.1:5432/fitcheck_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PostgreSQL test dependencies
        run: python -m pip install -e ".[dev,postgres]"

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run PostgreSQL integration gates
        run: >-
          python -m pytest
          tests/test_job_store_postgres.py
          tests/test_mcp_schema_migration_postgres.py
          -rs

  package-build:
    name: package-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build source and wheel distributions
        run: >-
          python -m pip install "build>=1.2,<2" &&
          python -m build --outdir "$RUNNER_TEMP/fitcheck-public-dist"

      - name: Verify distribution notices and locked Hormuz rules
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib
          import os
          import tarfile
          import zipfile

          root = Path(os.environ["GITHUB_WORKSPACE"])
          dist = Path(os.environ["RUNNER_TEMP"]) / "fitcheck-public-dist"
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          notice = (root / "THIRD_PARTY_NOTICES.md").read_bytes()
          rules = (root / "el/product/demo_fixtures/hormuz_rules.json").read_bytes()
          assert hashlib.sha256(rules).hexdigest() == (
              "56c45b0e41fdb0d1dd94654aff12fde49a8fc18fc71b168da148c4d84678da2f"
          )

          with zipfile.ZipFile(wheels[0]) as archive:
              notice_names = [
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/licenses/THIRD_PARTY_NOTICES.md")
              ]
              assert len(notice_names) == 1, notice_names
              assert archive.read(notice_names[0]) == notice
              rules_names = [
                  name for name in archive.namelist()
                  if name == "el/product/demo_fixtures/hormuz_rules.json"
              ]
              assert len(rules_names) == 1, rules_names
              assert archive.read(rules_names[0]) == rules

          with tarfile.open(sdists[0], "r:gz") as archive:
              notice_members = [
                  member for member in archive.getmembers()
                  if member.isfile()
                  and PurePosixPath(member.name).name == "THIRD_PARTY_NOTICES.md"
                  and len(PurePosixPath(member.name).parts) == 2
              ]
              assert len(notice_members) == 1, notice_members
              stream = archive.extractfile(notice_members[0])
              assert stream is not None and stream.read() == notice
              rules_members = [
                  member for member in archive.getmembers()
                  if member.isfile()
                  and member.name.endswith(
                      "/el/product/demo_fixtures/hormuz_rules.json"
                  )
              ]
              assert len(rules_members) == 1, rules_members
              stream = archive.extractfile(rules_members[0])
              assert stream is not None and stream.read() == rules
          PY

      - name: Install the public wheel in an isolated environment
        run: |
          test "$(find "$RUNNER_TEMP/fitcheck-public-dist" -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/fitcheck-public-dist" -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          python -m venv "$RUNNER_TEMP/fitcheck-public-wheel-smoke"
          PUBLIC_WHEEL="$(find "$RUNNER_TEMP/fitcheck-public-dist" -maxdepth 1 -name '*.whl' -print -quit)"
          "$RUNNER_TEMP/fitcheck-public-wheel-smoke/bin/python" -m pip install "$PUBLIC_WHEEL"
          "$RUNNER_TEMP/fitcheck-public-wheel-smoke/bin/python" -m pip check

      - name: Smoke the installed public wheel outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          GOOGLE_API_KEY: ""
          GEMINI_API_KEY: ""
          GOOGLE_APPLICATION_CREDENTIALS: /nonexistent/fitcheck-public-wheel-smoke.json
          GCE_METADATA_DISABLED: "true"
        run: |
          "$RUNNER_TEMP/fitcheck-public-wheel-smoke/bin/python" -I - <<'PY'
          from importlib import metadata
          from importlib.resources import files
          from pathlib import Path
          import json
          import os
          import demo
          import el
          import migrations
          from el.product import demo_frozen_markets

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          distribution = metadata.distribution("fitcheck")
          owned = {
              Path(distribution.locate_file(item)).resolve()
              for item in distribution.files or ()
          }
          for module in (demo, el, migrations, demo_frozen_markets):
              origin = Path(module.__file__).resolve()
              assert origin in owned, (module.__name__, origin)
              assert not origin.is_relative_to(workspace), origin
          for package, relative in (
              ("el.product", "static/product_console.html"),
              ("el.product.demo_fixtures", "retrieval/frozen_snapshot_phase0.json"),
              ("migrations", "versions/4f7c2e9a6b13_anonymous_demo_sessions.py"),
          ):
              assert files(package).joinpath(*relative.split("/")).is_file()
          assert any(
              entry.name == "fitcheck-demo"
              for entry in distribution.entry_points
          )

          market_resources = files("el.product.demo_fixtures").joinpath("markets")
          expected_market_resources = {
              "golden_market_structures.json",
              "synthetic-market-stablecoin-total-cap.json",
              "synthetic-market-stablecoin-unit-cap.json",
              "synthetic-market-treasury-ledger-payment.json",
              "synthetic-market-broker-tokenized-asset.json",
              "synthetic-market-broker-first-tokenized.json",
              "synthetic-market-broker-chain-token.json",
              "synthetic-event-stablecoin-cap.json",
              "synthetic-event-tokenized-listing.json",
          }
          resource_names = {
              resource.name
              for resource in market_resources.iterdir()
              if resource.is_file()
          }
          assert resource_names == expected_market_resources, resource_names

          market_fields = {
              "schema_version", "fixture_kind", "market_id", "title",
              "resolution_rules", "condition_id", "outcomes", "close_at_utc",
              "liquidity_usd", "source_url", "fixture_versioned_utc",
          }
          event_fields = {
              "schema_version", "fixture_kind", "event_id", "title",
              "description", "source_url", "fixture_versioned_utc", "markets",
          }
          retired_provider_fields = {
              "acceptingOrders", "clobTokenIds", "conditionId", "endDate",
              "groupItemTitle", "liquidityNum", "questionID", "resolutionSource",
          }
          for resource_name in sorted(expected_market_resources - {
              "golden_market_structures.json"
          }):
              payload = json.loads(market_resources.joinpath(resource_name).read_text())
              if resource_name.startswith("synthetic-market-"):
                  assert set(payload) == market_fields, (resource_name, set(payload))
                  bodies = (payload,)
              else:
                  assert set(payload) == event_fields, (resource_name, set(payload))
                  assert len(payload["markets"]) == 1, resource_name
                  assert set(payload["markets"][0]) == market_fields, resource_name
                  bodies = (payload, payload["markets"][0])
              for body in bodies:
                  assert retired_provider_fields.isdisjoint(body), resource_name

          expected_market_ids = {
              "synthetic-stablecoin-total-cap",
              "synthetic-stablecoin-unit-cap",
              "synthetic-treasury-ledger-payment",
              "synthetic-broker-tokenized-asset",
              "synthetic-broker-first-tokenized",
              "synthetic-broker-chain-token",
          }
          registered_market_ids = {
              market_id
              for pool in demo_frozen_markets.POOLS.values()
              for market_id in pool
          }
          assert registered_market_ids == expected_market_ids
          markets = {
              market_id: demo_frozen_markets.public_market(market_id)
              for market_id in sorted(expected_market_ids)
          }
          bound_market_ids = {
              market_id
              for market_id in expected_market_ids
              if demo_frozen_markets.PAIRS[market_id].get("event") is not None
          }
          assert bound_market_ids == {
              "synthetic-stablecoin-unit-cap",
              "synthetic-broker-first-tokenized",
          }
          associations = {
              market_id: demo_frozen_markets.event_association(
                  market_id, markets[market_id]
              )
              for market_id in sorted(bound_market_ids)
          }
          assert {
              association["event_resource"]
              for association in associations.values()
          } == {
              "synthetic-event-stablecoin-cap.json",
              "synthetic-event-tokenized-listing.json",
          }
          PY
          "$RUNNER_TEMP/fitcheck-public-wheel-smoke/bin/fitcheck-demo" --help >/dev/null

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fixture image without secrets
        run: docker build --tag fitcheck-fixture:ci .
